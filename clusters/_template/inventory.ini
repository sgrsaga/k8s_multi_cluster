# Kubespray inventory — __CLUSTER_NAME__
# [all] block is regenerated by scripts/render-inventory.sh from terraform output:
#   ./scripts/render-inventory.sh <provider> __CLUSTER_NAME__
# ansible_host = public IP (SSH), ip = private/NIC-bound IP (kubelet/etcd bind address).
# Bare-metal joiner lines (commented) are preserved by the renderer.

[all]
# PLACEHOLDERS — replaced by render-inventory.sh once terraform apply has run.
node-1 ansible_host=TBD ip=TBD etcd_member_name=etcd1
# node-2 ansible_host=TBD ip=TBD etcd_member_name=etcd2
# node-3 ansible_host=TBD ip=TBD etcd_member_name=etcd3
# Future bare-metal joiners — uncomment, set IPs, then run:
#   ./scripts/kubespray.sh __CLUSTER_NAME__ scale.yml
# bm-node-1 ansible_host=192.168.10.10 ip=192.168.10.10

[kube_control_plane]
node-1
# node-2
# node-3

[etcd]
node-1
# node-2
# node-3

[kube_node]
node-1
# node-2
# node-3
# bm-node-1

[k8s_cluster:children]
kube_control_plane
kube_node
